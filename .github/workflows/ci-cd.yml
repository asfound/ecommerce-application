name: CI/CD

on:
  pull_request:
    branches:
      - develop
      - 'sprint-*'
      - 'chore/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-modules

      - name: check for lint issues
        run: npm run lint:check

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-modules

      - name: check code formatting
        run: npm run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-modules

      - name: Run tests and generate coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests

  build:
    needs: [lint, format, test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-modules

      - name: Build
        run: npm run build

      - name: Deploy to Netlify (Preview)
        id: netlify
        uses: nwtgck/actions-netlify@v2.0
        with:
          publish-dir: ./dist
          production-branch: develop
          production-deploy: ${{ github.base_ref == 'develop' }}
          deploy-message: ${{ github.event.pull_request.title }}
          enable-commit-comment: true
          netlify-config-path: ./netlify.toml
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

    outputs:
      deploy-url: ${{ steps.netlify.outputs.deploy-url }}

  notify-message:
    needs: build
    if: always()
    runs-on: ubuntu-latest

    outputs:
      textMessage: ${{ steps.set-message.outputs.textMessage }}

    steps:
      - name: Set notify message
        id: set-message
        env:
          DEPLOY_URL: ${{ needs.build.outputs.deploy-url }}
          BUILD_RESULT: ${{ needs.build.result }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SUCCESS_MSG="✅ Deploy succeed [link](${DEPLOY_URL})
          message: ${PR_TITLE}"

          FAILURE_MSG="❌ Deploy failed on branch **${REF_NAME}**.
          [View logs](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID})"

          if [ "$BUILD_RESULT" = "success" ]; then
            echo "textMessage<<EOF" >> $GITHUB_OUTPUT
            echo "$SUCCESS_MSG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "textMessage<<EOF" >> $GITHUB_OUTPUT
            echo "$FAILURE_MSG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

  notify:
    needs: notify-message
    uses: ./.github/workflows/notify-telegram.yml
    with:
      textMessage: ${{ needs.notify-message.outputs.textMessage }}
    secrets:
      TG_CHAT_ID: ${{ github.base_ref == 'develop' && secrets.TG_PROD_CHAT_ID || secrets.TG_DEV_CHAT_ID }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
