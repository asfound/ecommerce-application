name: Build and Deploy to Netlify Preview

on:
  pull_request:
    branches:
      - 'sprint-*'
      - 'chore/*/**'

jobs:
  build:
    uses: ./.github/workflows/netlify.yml
    with:
      isProduction: false
#      deployMessage: "${{  github.event.pull_request.title }}"
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      TG_CHAT_ID: ${{secrets.TG_DEV_CHAT_ID}}
      TG_BOT_TOKEN: ${{secrets.TG_BOT_TOKEN}}
