name: Notify Telegram

on:
  workflow_call:
    inputs:
      textMessage:
        required: false
        type: string
    secrets:
      TG_CHAT_ID:
        required: true
      TG_BOT_TOKEN:
        required: true
jobs:
  notify-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        run: |
          escape_md2() {
          sed -E 's/([][()~`>#+\-=|{}.!_\\*])/\\\1/g' <<< "$1"
          }

          SAFE_MESSAGE=$(escape_md2 "${{ inputs.textMessage }}")

          curl -s -X POST https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage \
            -d chat_id="${{ secrets.TG_CHAT_ID }}" \
            -d text="${SAFE_MESSAGE}" \
            -d parse_mode="MarkdownV2"
