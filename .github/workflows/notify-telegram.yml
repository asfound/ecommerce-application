name: Notify Telegram

on:
  workflow_call:
    inputs:
      textMessage:
        required: false
        type: string
      TG_CHAT_ID:
        required: true
        type: string
jobs:
  notify-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage \
            -d chat_id="${{ inputs.TG_CHAT_ID }}" \
            -d text="${{ inputs.textMessage }}"
