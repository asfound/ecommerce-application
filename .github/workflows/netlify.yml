name: Build and Deploy to Netlify

on:
  workflow_call:
    inputs:
      isProduction:
        required: true
        type: boolean
      deployMessage:
        required: true
        type: string
      TG_CHAT_ID:
        required: true
        type: string

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Netlify (Preview)
        id: netlify
        uses: nwtgck/actions-netlify@v2.0
        with:
          publish-dir: ./dist
          production-branch: develop
          production-deploy: ${{ inputs.isProduction }}
          deploy-message: ${{ inputs.deployMessage }}
          enable-commit-comment: true
          overwrites-pull-request-comment: false
          netlify-config-path: ./netlify.toml
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  notify:
    uses: .github/workflows/notify-telegram.yml
    with:
      textMessage: '✅ link: ${{ steps.netlify.outputs.deploy-url }}, message: ${{inputs.deployMessage}}'
      TG_CHAT_ID: ${{inputs.TG_CHAT_ID}}

  notify-failure:
    name: Notify if Deploy Fails
    runs-on: ubuntu-latest
    needs: build
    if: failure()
    steps:
      - name: Send Telegram message
        uses: .github/workflows/notify-telegram.yml
        with:
          textMessage: "❌ Deploy failed on branch *${{ github.ref_name }}*.\n[View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          TG_CHAT_ID: ${{inputs.TG_CHAT_ID}}
